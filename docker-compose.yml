services:
  # ============================================================================
  # Core TSDB: Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.4
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-25GB}'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://${MONITORING_DOMAIN:-monitoring.example.com}/prometheus/'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:9090/prometheus/-/healthy || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      options:
        max-size: "30m"
        max-file: "3"

  # ============================================================================
  # Visualization: Grafana
  # ============================================================================
  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.7
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-ChangeMeStrongPassword123!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION=false
      - GF_PLUGINS_PREINSTALL_DISABLED=true
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-https://monitoring.example.com/}
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Alert Dispatcher: Alertmanager
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.2
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/:/etc/alertmanager/
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--web.external-url=https://${MONITORING_DOMAIN:-monitoring.example.com}/alertmanager/'
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Exporters
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.8
    expose:
      - 9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    container_name: snmp-exporter
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.3
    ports:
      - "9116:9116"
    volumes:
      - ./snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    container_name: blackbox-exporter
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.6
    ports:
      - "9115:9115"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  vmware-exporter:
    image: soroush7339/vmware_exporter:latest
    container_name: vmware-exporter
    restart: unless-stopped
    dns_search: []
    networks:
      monitoring:
        ipv4_address: 172.20.0.5
    ports:
      - "9272:9272"
    environment:
      VSPHERE_IGNORE_SSL: "true"
      VSPHERE_ALLOW_UNVERIFIED_SSL: "true"
    volumes:
      - ./prometheus/vmware_exporter/config.yml:/opt/vmware_exporter/config.yml:ro
    command:
      - '-c'
      - '/opt/vmware_exporter/config.yml'
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  monitoring:
    name: monitoring
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
