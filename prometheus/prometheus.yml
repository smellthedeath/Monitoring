# ==============================================================================
# Prometheus Configuration (Production Enterprise Stack)
# Sanitized Template - Replace placeholders with your network parameters
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - path_prefix: /alertmanager/
      static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # =====================================================
  # 🟢 Host Stack Metrics (Node Exporter)
  # =====================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - node-exporter:9100

  # =====================================================
  # 🟢 MikroTik Routers & Switches (Dual-Module: Health + IF-MIB)
  # =====================================================
  - job_name: 'mikrotik'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 10.0.0.1    # Core Switch (e.g. CRS317)
          - 10.0.0.2    # Core Gateway / Router (e.g. RB1100)
    metrics_path: /snmp
    params:
      module: [mikrotik, if_mib]
      auth: [mikrotik_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # =====================================================
  # 🟢 Cisco Catalyst Core & Access Switches
  # =====================================================
  - job_name: 'cisco-switches'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 10.0.1.1    # Switch 1
          - 10.0.1.2    # Switch 2
          - 10.0.1.3    # Switch 3
          - 10.0.1.4    # Switch 4
          - 10.0.1.5    # Switch 5
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [cisco_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # =====================================================
  # 🟢 Asterisk VoIP (Simotel / FreePBX) Telephony Exporter
  # =====================================================
  - job_name: 'asterisk'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '10.0.0.200:9200'
        labels:
          instance: '10.0.0.200'
          name: 'VoIP'
          env: 'production'

  # =====================================================
  # 🟢 Linux Fleet (File SD)
  # =====================================================
  - job_name: 'node_exporter_dynamic'
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/linux_hosts.json

  # =====================================================
  # 🟢 Windows Fleet (File SD)
  # =====================================================
  - job_name: 'windows_exporter'
    scrape_interval: 30s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/windows_hosts.json

  # =====================================================
  # 🟢 Dahua NVR ICMP Ping Probe
  # =====================================================
  - job_name: 'dahua-nvr'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 10.0.2.5    # NVR IP Address
    metrics_path: /probe
    params:
      module: [icmp]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # =====================================================
  # 🟢 IP Cameras Fleet (ICMP Ping Probes)
  # =====================================================
  - job_name: 'blackbox_icmp'
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/blackbox_icmp.json
    metrics_path: /probe
    params:
      module: [icmp]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # =====================================================
  # 🟢 Web Endpoints & SSL Certificate Expiry Probes
  # =====================================================
  - job_name: 'blackbox'
    scrape_interval: 30s
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/blackbox_targets.json
    metrics_path: /probe
    params:
      module: [http_2xx]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # =====================================================
  # 🟢 VMware vCenter Telemetry
  # =====================================================
  - job_name: 'vmware-vcenter'
    scrape_interval: 2m
    scrape_timeout: 90s
    static_configs:
      - targets:
          - 10.0.0.50   # vCenter IP
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: vmware-exporter:9272
