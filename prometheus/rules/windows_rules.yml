groups:
  - name: windows-servers
    rules:
      # ==================== Host Health ====================
      - alert: WindowsServerDown
        expr: up{job="windows_exporter"} == 0
        for: 3m
        labels:
          severity: critical
          service: exporter
          type: health
        annotations:
          summary: "🚨 Windows Server {{ $labels.instance }} is DOWN"
          description: "Windows host {{ $labels.instance }} is unreachable for more than 3 minutes."

      # ==================== CPU & Memory ====================
      - alert: WindowsHighCPUUsage
        expr: 100 - (avg by (instance) (rate(windows_cpu_time_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
          service: cpu
          type: performance
        annotations:
          summary: "⚠️ High Windows CPU Usage on {{ $labels.instance }}"
          description: "CPU usage is at {{ printf \"%.1f\" $value }}%."

      - alert: WindowsHighMemoryUsage
        expr: (1 - (windows_os_physical_memory_free_bytes / windows_cs_physical_memory_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: memory
          type: performance
        annotations:
          summary: "🚨 Critical Windows Memory Usage on {{ $labels.instance }}"
          description: "RAM usage is at {{ printf \"%.1f\" $value }}%."

      # ==================== Disks & Storage ====================
      - alert: WindowsDiskUsageWarning
        expr: ((windows_logical_disk_size_bytes{volume=~"[A-Z]:"} - windows_logical_disk_free_bytes{volume=~"[A-Z]:"}) / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: disk
          type: storage
        annotations:
          summary: "⚠️ Windows Drive {{ $labels.volume }} High Usage on {{ $labels.instance }}"
          description: "Drive {{ $labels.volume }} on {{ $labels.instance }} exceeded 80% usage (Current: {{ printf \"%.1f\" $value }}%)."

      - alert: WindowsDiskUsageCritical
        expr: ((windows_logical_disk_size_bytes{volume=~"[A-Z]:"} - windows_logical_disk_free_bytes{volume=~"[A-Z]:"}) / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}) * 100 > 90
        for: 3m
        labels:
          severity: critical
          service: disk
          type: storage
        annotations:
          summary: "🚨 Windows Drive {{ $labels.volume }} Almost Full on {{ $labels.instance }}"
          description: "Drive {{ $labels.volume }} on {{ $labels.instance }} exceeded 90% usage (Current: {{ printf \"%.1f\" $value }}%)."

      - alert: WindowsDiskWillFillIn24Hours
        expr: predict_linear(windows_logical_disk_free_bytes{volume=~"[A-Z]:"}[4h], 86400) < 0 and ((windows_logical_disk_size_bytes{volume=~"[A-Z]:"} - windows_logical_disk_free_bytes{volume=~"[A-Z]:"}) / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}) * 100 > 65
        for: 15m
        labels:
          severity: warning
          service: disk
          type: storage
        annotations:
          summary: "⚠️ Windows Drive {{ $labels.volume }} Will Fill in 24h on {{ $labels.instance }}"
          description: "Linear prediction estimates drive {{ $labels.volume }} on {{ $labels.instance }} will fill up within 24 hours."

      - alert: WindowsHighDiskIO
        expr: rate(windows_logical_disk_io_time_total[5m]) * 100 > 15
        for: 10m
        labels:
          severity: warning
          service: disk
          type: performance
        annotations:
          summary: "High Disk I/O on {{ $labels.instance }}"
          description: "Disk I/O time exceeds 15%."
